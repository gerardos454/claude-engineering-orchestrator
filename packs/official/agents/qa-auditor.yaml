id: qa-auditor
role: auditor
activates_when:
  files: [phpunit.xml*, tests/**, package.json, pubspec.yaml]
  task_signals: [test, regression, quality, edge-case, validation]
produces:
  - findings
  - verdict
  - test-adequacy-evidence
reviewed_by:
  - principal-engineering-auditor
requires:
  tools: [Read, Grep, Glob, Bash]
  capabilities: [orchestration]
risk:
  forbidden: [file-modification, self-approval]
