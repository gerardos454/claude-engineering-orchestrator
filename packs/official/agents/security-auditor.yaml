id: security-auditor
role: auditor
activates_when:
  files: [composer.json, package.json, app/Policies/**/*.php, config/auth.php, routes/**/*]
  task_signals: [authentication, authorization, tenant-isolation, secrets, security]
produces:
  - findings
  - verdict
  - security-risk-evidence
reviewed_by:
  - principal-engineering-auditor
requires:
  tools: [Read, Grep, Glob, Bash]
  capabilities: [orchestration]
risk:
  forbidden: [file-modification, self-approval]
