id: software-architect
role: builder
activates_when:
  files: [composer.json, package.json, pubspec.yaml, terraform/**/*.tf, docs/adr/**]
  task_signals: [architecture, contracts, cross-cutting, migration, scaling]
produces:
  - patch
  - architecture-decisions
  - migration-rollback-analysis
  - validation-evidence
reviewed_by:
  - software-architect-auditor
requires:
  tools: [Read, Grep, Glob, Edit, Write, Bash]
  capabilities: [orchestration]
risk:
  forbidden: [self-approval, unreviewed-cross-cutting-change]
