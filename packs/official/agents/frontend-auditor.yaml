id: frontend-auditor
role: auditor
activates_when:
  files:
    - package.json
    - tailwind.config.*
    - resources/**/*.blade.php
    - "resources/**/*.{js,ts,jsx,tsx}"
  task_signals: [web-ui, frontend, responsive, accessibility, client-state]
produces:
  - findings
  - verdict
  - frontend-risk-evidence
reviewed_by:
  - principal-engineering-auditor
requires:
  tools: [Read, Grep, Glob, Bash]
  capabilities: [orchestration]
risk:
  forbidden: [file-modification, self-approval]
