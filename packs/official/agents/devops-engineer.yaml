id: devops-engineer
role: builder
activates_when:
  files: [.github/workflows/**, Dockerfile*, docker-compose*.yml, terraform/**/*.tf, infra/**]
  task_signals: [aws, ci-cd, deployment, observability, reliability]
produces:
  - patch
  - deployment-rollback-evidence
  - reliability-check-results
reviewed_by:
  - devops-auditor
requires:
  tools: [Read, Grep, Glob, Edit, Write, Bash]
  capabilities: [orchestration]
risk:
  forbidden: [self-approval, unapproved-production-deploy, secret-exposure]
