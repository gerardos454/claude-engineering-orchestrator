id: backend-auditor
role: auditor
activates_when:
  files: [composer.json, artisan, routes/**/*.php, app/**/*.php]
  task_signals: [api, backend, queue, integration, tenant-scoping]
produces:
  - findings
  - verdict
  - backend-risk-evidence
reviewed_by:
  - principal-engineering-auditor
requires:
  tools: [Read, Grep, Glob, Bash]
  capabilities: [orchestration]
risk:
  forbidden: [file-modification, self-approval]
