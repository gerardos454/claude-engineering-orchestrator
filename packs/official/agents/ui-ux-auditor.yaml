id: ui-ux-auditor
role: auditor
activates_when:
  files: [tailwind.config.*, resources/**/*.blade.php, lib/**/*.dart]
  task_signals: [ui, ux, accessibility, product-flow, design-system]
produces:
  - findings
  - verdict
  - usability-accessibility-evidence
reviewed_by:
  - principal-engineering-auditor
requires:
  tools: [Read, Grep, Glob, Bash]
  capabilities: [orchestration]
risk:
  forbidden: [file-modification, self-approval]
