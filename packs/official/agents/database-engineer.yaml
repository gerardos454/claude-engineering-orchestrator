id: database-engineer
role: builder
activates_when:
  files: [database/migrations/**/*.php, database/schema/**, "**/*.sql"]
  task_signals: [database, schema, migration, query-performance, data-integrity]
produces:
  - patch
  - schema-query-evidence
  - migration-rollback-analysis
reviewed_by:
  - database-auditor
requires:
  tools: [Read, Grep, Glob, Edit, Write, Bash]
  capabilities: [orchestration]
risk:
  forbidden: [self-approval, unreviewed-destructive-migration]
