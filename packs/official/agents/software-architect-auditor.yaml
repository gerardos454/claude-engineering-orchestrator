id: software-architect-auditor
role: auditor
activates_when:
  files: [composer.json, package.json, pubspec.yaml, terraform/**/*.tf, docs/adr/**]
  task_signals: [architecture, contracts, cross-cutting, migration, scaling]
produces:
  - findings
  - verdict
  - architecture-risk-evidence
reviewed_by:
  - principal-engineering-auditor
requires:
  tools: [Read, Grep, Glob, Bash]
  capabilities: [orchestration]
risk:
  forbidden: [file-modification, self-approval]
